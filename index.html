<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>듣기 연습</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1f6f68">
<style>
/* Layout: one screen at a time (start / practice / done), everything centred in a phone-width column, huge type for a ~90-year-old listener */
:root {
  --bg: #f4f1e8;
  --card: #fffdf7;
  --ink: #1d2422;
  --muted: #5b6662;
  --accent: #1f6f68;
  --accent-ink: #ffffff;
  --soft: #dcebe7;
  --line: #d9d3c3;
  --answer: #9a3412;
  --font: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font);
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  -webkit-tap-highlight-color: transparent; user-select: none;
}
.screen { max-width: 520px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.screen[hidden] { display: none; }
.brand { font-size: 1.6rem; font-weight: 700; display: flex; align-items: baseline; gap: 10px; }
.ver { font-size: .85rem; font-weight: 400; color: var(--muted); }
.lead { font-size: 1.5rem; line-height: 1.45; margin: 0; }
.label { font-size: 1.3rem; color: var(--muted); margin: 0; }
button { font: inherit; border: 0; cursor: pointer; border-radius: 18px; }
button:focus-visible { outline: 4px solid var(--answer); outline-offset: 3px; }
.big {
  background: var(--accent); color: var(--accent-ink); font-size: 2.4rem; font-weight: 700;
  padding: 28px 12px; width: 100%;
}
.modes { display: grid; gap: 10px; }
.mode {
  background: var(--card); color: var(--ink); border: 3px solid var(--line);
  font-size: 1.6rem; font-weight: 700; padding: 14px 16px; text-align: left;
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
}
.mode small { font-size: 1.05rem; font-weight: 400; color: var(--muted); }
.mode[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); }
.mode[aria-pressed="true"]::before { content: "✓"; color: var(--accent); margin-right: -4px; }
.mode:disabled { opacity: .45; }
.voices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.voice {
  background: var(--card); color: var(--ink); border: 3px solid var(--line);
  font-size: 1.5rem; font-weight: 700; padding: 22px 8px; line-height: 1.3;
}
.voice small { display: block; font-size: 1.05rem; font-weight: 400; color: var(--muted); }
.voice[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); }
.voice[aria-pressed="true"]::before { content: "✓ "; color: var(--accent); }
.spacer { flex: 1; }
.progress { font-size: 1.4rem; color: var(--muted); display: flex; justify-content: space-between; align-items: center; font-variant-numeric: tabular-nums; }
.bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.card {
  flex: 1; background: var(--card); border: 2px solid var(--line); border-radius: 24px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px 12px; text-align: center;
}
.word { font-size: clamp(5rem, 28vw, 8rem); font-weight: 700; line-height: 1.1; letter-spacing: .04em; }
.word.answer { color: var(--answer); }
.hint { font-size: 1.6rem; color: var(--muted); min-height: 2.2em; font-variant-numeric: tabular-nums; }
.mate { font-size: 1.5rem; color: var(--muted); min-height: 1.6em; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sub { background: var(--card); color: var(--ink); border: 3px solid var(--line); font-size: 1.7rem; font-weight: 700; padding: 22px 8px; }
.done-mark { font-size: 6rem; text-align: center; color: var(--accent); line-height: 1; }
.done-text { font-size: 2.6rem; font-weight: 700; text-align: center; margin: 0; }
@media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }
</style>
</head>
<body>

<section class="screen" id="s-start">
  <div class="brand">듣기 연습<span class="ver">v1.3</span></div>
  <p class="lead">잘 듣고 생각해 보시면 잠시 뒤에 답이 나와요.</p>
  <p class="label">무엇을 연습할까요?</p>
  <div class="modes">
    <button class="mode" id="m-mix" type="button" aria-pressed="true"><span>골고루</span><small></small></button>
    <button class="mode" id="m-hard" type="button" aria-pressed="false"><span>어려운 단어</span><small></small></button>
    <button class="mode" id="m-wrong" type="button" aria-pressed="false"><span>틀린 단어 다시</span><small></small></button>
  </div>
  <p class="label">목소리</p>
  <div class="voices">
    <button class="voice" id="v-sunhi" type="button" aria-pressed="true">여자 목소리<small>선히</small></button>
    <button class="voice" id="v-injoon" type="button" aria-pressed="false">남자 목소리<small>인준</small></button>
  </div>
  <div class="spacer"></div>
  <button class="big" id="start" type="button">시작</button>
</section>

<section class="screen" id="s-play" hidden>
  <div class="progress"><span id="pos">1 / 15</span><span id="state"></span></div>
  <div class="bar"><div id="bar"></div></div>
  <div class="card" aria-live="polite">
    <div class="word" id="word">?</div>
    <div class="mate" id="mate"></div>
    <div class="hint" id="hint">잘 들어 보세요</div>
  </div>
  <div class="row2">
    <button class="sub" id="again" type="button">다시 듣기</button>
    <button class="sub" id="pause" type="button">멈춤</button>
  </div>
</section>

<section class="screen" id="s-pause" hidden>
  <div class="spacer"></div>
  <p class="done-text">잠시 멈췄어요</p>
  <div class="spacer"></div>
  <button class="big" id="resume" type="button">계속하기</button>
  <button class="sub" id="home" type="button">처음으로</button>
</section>

<section class="screen" id="s-done" hidden>
  <div class="spacer"></div>
  <div class="done-mark">✓</div>
  <p class="done-text">오늘 연습 끝!<br>수고하셨어요</p>
  <div class="spacer"></div>
  <button class="big" id="more" type="button">한 번 더 하기</button>
</section>

<script>
// Mode ③ "자동으로 답 보기" — values from APP-REQUIREMENTS.md 4.7
const PLAYS = 2;          // times the word is played before the answer
const GAP = 1500;         // ms between plays (v1.3: was 800)
const WAIT = 4;           // seconds before the answer shows
const HOLD = 2500;        // ms the answer stays after its replay
const RATE = 0.85;

const $ = id => document.getElementById(id);
const audio = new Audio();
const sleep = ms => new Promise(r => setTimeout(r, ms));
let words = [];
let list = [];
let index = 0;
let run = 0;              // bumps whenever the current sequence must stop
let voice = 'sunhi';
let wakeLock = null;

function save(k, v) { try { localStorage.setItem('lp.' + k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem('lp.' + k); } catch (e) { return null; } }

const fileName = w => [...w].map(c => c.codePointAt(0).toString(16).toUpperCase()).join('-') + '.mp3';

function show(id) {
  for (const s of document.querySelectorAll('.screen')) s.hidden = s.id !== id;
}

function setVoice(v) {
  voice = v;
  save('voice', v);
  $('v-sunhi').setAttribute('aria-pressed', v === 'sunhi');
  $('v-injoon').setAttribute('aria-pressed', v === 'injoon');
}

function playWord(w) {
  return new Promise(resolve => {
    let done = false;
    const finish = () => { if (!done) { done = true; resolve(); } };
    audio.onended = finish; audio.onerror = finish;
    audio.src = `audio/${voice}/${fileName(w)}`;
    audio.playbackRate = RATE;
    audio.preservesPitch = true;
    audio.play().catch(finish);
    setTimeout(finish, 6000);
  });
}

// Shuffle so a word and its confusing mate never come one after the other
function shuffled(items) {
  let order = items;
  for (let t = 0; t < 300; t++) {
    order = items.slice();
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    const ok = order.every((x, i) => i === 0 || (x.m !== order[i - 1].w && order[i - 1].m !== x.w));
    if (ok) break;
  }
  return order;
}

async function keepAwake() {
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {}
}

async function step() {
  const me = ++run;
  const item = list[index];
  $('pos').textContent = `${index + 1} / ${list.length}`;
  $('bar').style.width = `${(index / list.length) * 100}%`;
  $('word').textContent = '?';
  $('word').classList.remove('answer');
  $('mate').textContent = '';
  $('hint').textContent = '잘 들어 보세요';

  for (let i = 0; i < PLAYS; i++) {
    await playWord(item.w);
    if (me !== run) return;
    await sleep(GAP);
    if (me !== run) return;
  }
  for (let s = WAIT; s > 0; s--) {
    $('hint').textContent = '생각해 보세요 ' + '●'.repeat(s);
    await sleep(1000);
    if (me !== run) return;
  }
  $('word').textContent = item.w;
  $('word').classList.add('answer');
  $('mate').textContent = item.m ? `헷갈리는 말: ${item.m}` : '';
  $('hint').textContent = '';
  await playWord(item.w);
  if (me !== run) return;
  await sleep(HOLD);
  if (me !== run) return;

  index++;
  if (index < list.length) step();
  else finish();
}

function finish() {
  run++;
  $('bar').style.width = '100%';
  show('s-done');
  try { wakeLock?.release(); } catch (e) {}
}

// words.json holds every sheet word with a group: g1 recently confused (p = weight),
// g2 heard few times, g3 review, g4 graduated; d = difficulty 0–3, x = wrong last time.
// "골고루" takes 6 / 5 / 4 from g1 / g2 / g3, least recently heard first, so every run brings a different set.
// "어려운 단어" takes hard words (d ≥ 2), "틀린 단어 다시" the words wrong last time (APP-REQUIREMENTS.md 4.10).
const PICK = { 1: 6, 2: 5, 3: 4 };
const SIZE = PICK[1] + PICK[2] + PICK[3];
const WEAK_REST = 2;      // a confused word skips this many sessions before it may come back
const HARD = 2;
let mode = 'mix';

const hardWords = () => words.filter(x => x.d >= HARD);
const wrongWords = () => words.filter(x => x.x);

function setMode(m) {
  mode = m;
  save('mode', m);
  for (const k of ['mix', 'hard', 'wrong']) $('m-' + k).setAttribute('aria-pressed', k === m);
}

function showCounts() {
  $('m-hard').querySelector('small').textContent = `${hardWords().length}개 중에서`;
  const n = wrongWords().length;
  $('m-wrong').querySelector('small').textContent = n ? `${n}개` : '없어요';
  $('m-wrong').disabled = !n;
  if (!n && mode === 'wrong') setMode('mix');
}

function pickSession() {
  let seen = {};
  try { seen = JSON.parse(load('seen')) || {}; } catch (e) {}
  const session = (Number(load('session')) || 0) + 1;
  const age = w => (w in seen ? session - seen[w] : 1e6);
  const chosen = new Map();
  const add = x => { if (x && !chosen.has(x.w)) chosen.set(x.w, x); };

  // least recently heard first (unheard ones in random order)
  const oldest = (pool, n) => pool
    .filter(x => !chosen.has(x.w))
    .map(x => [age(x.w) + Math.random(), x])
    .sort((a, b) => b[0] - a[0])
    .slice(0, n)
    .map(a => a[1]);

  if (mode === 'hard') {
    oldest(hardWords(), SIZE).forEach(add);
    words.filter(x => x.d === HARD - 1 && !chosen.has(x.w))
      .sort((a, b) => b.p - a.p).slice(0, SIZE - chosen.size).forEach(add);
  } else if (mode === 'wrong') {
    oldest(wrongWords(), SIZE).forEach(add);
  } else {
    pickMix(age, add, chosen, oldest);
  }

  for (const w of chosen.keys()) seen[w] = session;
  save('seen', JSON.stringify(seen));
  save('session', session);
  return [...chosen.values()];
}

function pickMix(age, add, chosen, oldest) {
  const byWord = new Map(words.map(x => [x.w, x]));
  const inGroups = groups => words.filter(x => groups.includes(x.g));

  // recently confused: weighted by p, with its mate when the mate is a sheet word
  const weak = words.filter(x => x.g === 1);
  let pool = weak.filter(x => age(x.w) > WEAK_REST);
  if (pool.length < PICK[1]) pool = weak.slice();
  while (chosen.size < PICK[1] && pool.length) {
    let r = Math.random() * pool.reduce((s, x) => s + Math.max(x.p, 1), 0);
    let i = pool.findIndex(x => (r -= Math.max(x.p, 1)) < 0);
    if (i < 0) i = pool.length - 1;
    const x = pool.splice(i, 1)[0];
    add(x);
    const mate = byWord.get(x.m);
    if (mate && chosen.size < PICK[1]) { add(mate); pool = pool.filter(y => y !== mate); }
  }

  // the rest: least recently heard first
  const graduated = Math.random() < 0.3 ? 1 : 0;
  oldest(inGroups([2]), PICK[2]).forEach(add);
  oldest(inGroups([3]), PICK[3] - graduated).forEach(add);
  oldest(inGroups([4]), graduated).forEach(add);
  if (chosen.size < SIZE) oldest(words, SIZE - chosen.size).forEach(add);
}

function begin() {
  list = shuffled(pickSession());
  for (const x of list) fetch(`audio/${voice}/${fileName(x.w)}`).catch(() => {});
  index = 0;
  show('s-play');
  keepAwake();
  step();
}

function stopSound() {
  run++;
  audio.pause();
}

$('m-mix').onclick = () => setMode('mix');
$('m-hard').onclick = () => setMode('hard');
$('m-wrong').onclick = () => setMode('wrong');
$('v-sunhi').onclick = () => setVoice('sunhi');
$('v-injoon').onclick = () => setVoice('injoon');
$('start').onclick = begin;
$('more').onclick = begin;
$('again').onclick = () => { stopSound(); step(); };
$('pause').onclick = () => { stopSound(); show('s-pause'); };
$('resume').onclick = () => { show('s-play'); keepAwake(); step(); };
$('home').onclick = () => { stopSound(); show('s-start'); };
document.addEventListener('visibilitychange', () => {
  if (document.hidden && !$('s-play').hidden) { stopSound(); show('s-pause'); }
});

setVoice(load('voice') === 'injoon' ? 'injoon' : 'sunhi');
setMode(['hard', 'wrong'].includes(load('mode')) ? load('mode') : 'mix');

fetch('words.json', { cache: 'no-cache' })
  .then(r => r.json())
  .then(data => {
    words = data;
    showCounts();
  })
  .catch(() => { $('start').disabled = true; $('start').textContent = '단어를 못 불러왔어요'; });

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
